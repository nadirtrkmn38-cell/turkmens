<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Nadir Türkmen" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-->
    <script>
      // JS çalışıyorsa animasyonlar devreye girer; bir şey ters giderse 6 sn sonra içerik yine görünür.
      document.documentElement.classList.add('js');
      window.__ntFailsafe = setTimeout(function () {
        var d = document.documentElement;
        d.classList.add('is-ready');
        var l = document.getElementById('loader');
        if (l) l.classList.add('is-done');
        var r = document.querySelectorAll('[data-reveal]');
        for (var i = 0; i < r.length; i++) r[i].classList.add('is-in');
      }, 6000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas class="webgl" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader__inner">
        <div class="loader__mark">NT</div>
        <div class="loader__bar"><span></span></div>
        <div class="loader__meta"><span>Nadir Türkmen</span><span class="loader__count">000</span></div>
      </div>
    </div>

    <div id="app"><!--app--></div>
  </body>
</html>
